<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty Dashboard — AI Project Similarity Detection</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="dashboard">
    <nav class="navbar">
      <h1>🤖 AI Similarity Detection</h1>
      <div class="navbar-right">
        <span class="user-info">🎓 <strong id="user-name">Faculty</strong></span>
        <a class="btn" href="/ir">IR Dashboard</a><button class="btn" onclick="logout()">Logout</button>
      </div>
    </nav>

    <div class="container">
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-icon">👨‍🎓</div><div class="stat-value" id="stat-students">0</div><div class="stat-label">Students</div></div>
        <div class="stat-card"><div class="stat-icon">📋</div><div class="stat-value" id="stat-projects">0</div><div class="stat-label">Submitted</div></div>
        <div class="stat-card"><div class="stat-icon">✅</div><div class="stat-value" id="stat-approved">0</div><div class="stat-label">Approved</div></div>
        <div class="stat-card"><div class="stat-icon">⚠️</div><div class="stat-value" id="stat-warned">0</div><div class="stat-label">Warned</div></div>
      </div>

      <div class="card">
        <div class="card-header">
          <h2>📑 All Project Titles (AI Monitored)</h2>
          <input type="text" class="search-input" id="search-input" placeholder="🔍 Search..." oninput="filterProjects()">
        </div>
        <div id="projects-content">
          <div class="loading"><div class="spinner"></div><p style="margin-top:12px">Loading...</p></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Warn Modal -->
  <div class="modal-overlay" id="warn-modal">
    <div class="modal">
      <div class="modal-header">
        <h3>⚠️ Warn Student</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <p style="margin-bottom:6px;color:var(--text-light);font-size:.85rem">Student: <strong id="warn-student-name"></strong></p>
        <p style="margin-bottom:6px;color:var(--text-light);font-size:.85rem">Roll No: <strong id="warn-student-rollno"></strong></p>
        <p style="margin-bottom:14px;color:var(--text-light);font-size:.85rem">Title: <strong id="warn-project-title"></strong></p>
        <div class="form-group">
          <label for="warn-message">Warning Message</label>
          <textarea id="warn-message" placeholder="Explain why the student should change their title..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-sm" style="background:var(--text-light);color:#fff" onclick="closeModal()">Cancel</button>
        <button class="btn btn-warning btn-sm" id="send-warn-btn" onclick="sendWarning()">Send Warning</button>
      </div>
    </div>
  </div>

  <!-- DL Review Modal -->
  <div class="modal-overlay" id="dl-modal">
    <div class="modal" style="max-width:600px">
      <div class="modal-header">
        <h3>🧠 Deep Learning Syllabus Analysis</h3>
        <button class="modal-close" onclick="closeDLModal()">&times;</button>
      </div>
      <div class="modal-body" id="dl-modal-body">
        <div class="loading"><div class="spinner"></div><p style="margin-top:12px">Analyzing models...</p></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-sm btn-primary" onclick="closeDLModal()">Close</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script>
    let currentUser=null, allProjects=[], warnProjectId=null;

    async function init(){
      try{
        const res=await fetch('/api/auth/me');
        const d=await res.json();
        if(!d.user||d.user.role!=='faculty'){window.location.href='/';return;}
        currentUser=d.user;
        document.getElementById('user-name').textContent=currentUser.name;
        await loadStats();
        await loadProjects();
        setInterval(()=>{loadStats();loadProjects();},10000);
      }catch{
        window.location.href='/';
      }
    }

    async function loadStats(){
      try{
        const res=await fetch('/api/faculty/stats');
        if(!res.ok) throw new Error('Stats request failed');
        const d=await res.json();
        const s=d.stats;
        if(s){
          document.getElementById('stat-students').textContent=s.totalStudents;
          document.getElementById('stat-projects').textContent=s.totalProjects;
          document.getElementById('stat-approved').textContent=s.approvedProjects;
          document.getElementById('stat-warned').textContent=s.warnedProjects;
        }
      }catch(e){
        console.error('Failed to load faculty stats:', e);
      }
    }

    async function loadProjects(){
      try{
        const res=await fetch('/api/faculty/projects');
        if(!res.ok) throw new Error('Projects request failed');
        const d=await res.json();
        allProjects=d.projects||[];
        renderProjects(allProjects);
      }catch(e){
        document.getElementById('projects-content').innerHTML='<div class="empty-state"><p style="color:var(--danger)">Error loading projects. Please refresh or try again.</p></div>';
      }
    }

    function renderProjects(projects){
      const el=document.getElementById('projects-content');
      if(!projects.length){
        el.innerHTML='<div class="empty-state"><div class="empty-icon">📭</div><p>No projects submitted yet.</p></div>';
        return;
      }
      el.innerHTML=`
        <div class="table-responsive"><table>
          <thead><tr><th>#</th><th>Student</th><th>Roll No</th><th>Project Title</th><th>Domain (LSTM)</th><th>Status</th><th>AI Score</th><th>Warns</th><th>Actions</th></tr></thead>
          <tbody>${projects.map((p,i)=>`<tr>
            <td>${i+1}</td>
            <td><span class="title-text">${esc(p.student_name)}</span></td>
            <td><span class="student-name">${esc(p.student_username)}</span></td>
            <td>
              <div class="title-text">${esc(p.title)}</div>
              ${p.description?`<div style="font-size:.75rem;color:var(--text-light);margin-top:2px"><em>${esc(p.description)}</em></div>`:''}
              ${p.max_similarity>=40?`<div style="margin-top:3px;font-size:.72rem;color:var(--text-light)">Similar to: <em>${esc(p.most_similar_to)}</em></div>`:''}
            </td>
            <td><span class="badge" style="background:#e0e7ff;color:#3730a3">${esc(p.domain || 'Unclassified')}</span></td>
            <td><span class="badge badge-${p.status}">${p.status}</span></td>
            <td>${p.max_similarity>0
              ?`<span class="badge ${p.max_similarity>=55?'badge-similarity':p.max_similarity>=40?'badge-warned':'badge-submitted'}">${p.max_similarity}%</span>`
              :'<span style="color:var(--text-light)">—</span>'}</td>
            <td><span style="color:${p.warning_count>0?'var(--warning)':'var(--text-light)'};font-weight:${p.warning_count>0?'700':'400'}">${p.warning_count}</span></td>
            <td><div class="actions-cell">
              <button class="btn btn-outline btn-sm" onclick="viewDL(${p.id})">🧠 DL Review</button>
              <button class="btn btn-warning btn-sm" onclick="openModal(${p.id},'${escA(p.student_name)}','${escA(p.student_username)}','${escA(p.title)}')">Warn</button>
              ${p.status!=='approved'?`<button class="btn btn-success btn-sm" onclick="approve(${p.id})">Approve</button>`:''}
            </div></td>
          </tr>`).join('')}</tbody>
        </table></div>`;
    }

    function filterProjects(){
      const q=document.getElementById('search-input').value.toLowerCase();
      renderProjects(allProjects.filter(p=>p.title.toLowerCase().includes(q)||p.student_name.toLowerCase().includes(q)||p.student_username.toLowerCase().includes(q)));
    }

    function openModal(id,name,rollno,title){
      warnProjectId=id;
      document.getElementById('warn-student-name').textContent=name;
      document.getElementById('warn-student-rollno').textContent=rollno;
      document.getElementById('warn-project-title').textContent=title;
      document.getElementById('warn-message').value='';
      document.getElementById('warn-modal').classList.add('active');
    }
    function closeModal(){document.getElementById('warn-modal').classList.remove('active');warnProjectId=null;}

    async function sendWarning(){
      const msg=document.getElementById('warn-message').value.trim();
      if(msg.length<5){showToast('Message too short','error');return;}
      const btn=document.getElementById('send-warn-btn');
      btn.disabled=true;btn.textContent='Sending...';
      try{
        const res=await fetch(`/api/faculty/warn/${warnProjectId}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg})});
        if(res.ok){showToast('Warning sent!','success');closeModal();await loadStats();await loadProjects();}
        else{const d=await res.json();showToast(d.error,'error');}
      }catch{showToast('Connection error','error');}
      btn.disabled=false;btn.textContent='Send Warning';
    }

    async function approve(id){
      try{
        const res=await fetch(`/api/faculty/approve/${id}`,{method:'POST'});
        if(res.ok){showToast('Approved!','success');await loadStats();await loadProjects();}
        else{const d=await res.json();showToast(d.error,'error');}
      }catch{showToast('Connection error','error');}
    }

    async function viewDL(pid){
      document.getElementById('dl-modal').classList.add('active');
      const b=document.getElementById('dl-modal-body');
      b.innerHTML='<div class="loading"><div class="spinner"></div><p style="margin-top:12px">Running Decision Review...</p></div>';
      try{
        const res=await fetch(`/api/faculty/project/${pid}/dl-analysis`);
        const data=await res.json();
        if(!res.ok){b.innerHTML=`<p style="color:var(--danger)">Error: ${esc(data.error||'Failed to load')}</p>`;return;}

        const rev=data.decision_review;
        const p=data.project;
        const grp=rev.grouped_technologies || {};

        let overallBadgeClass='badge-submitted';
        if(rev.overall_review==='High Risk') overallBadgeClass='badge-similarity';
        else if(rev.overall_review==='Needs Review') overallBadgeClass='badge-warned';

        let noveltyBadgeClass='badge-submitted';
        if(rev.novelty_signal.startsWith('Unusual')) noveltyBadgeClass='badge-similarity';
        else if(rev.novelty_signal.startsWith('Needs Review')) noveltyBadgeClass='badge-warned';

        b.innerHTML=`
          <!-- Header: Title & Decision Summary -->
          <div style="background:#f8fafc;padding:12px 14px;border-radius:6px;border:1px solid #e2e8f0;margin-bottom:12px">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px">
              <h4 style="margin:0;font-size:1.02rem;color:var(--text-dark);line-height:1.3">${esc(p.title)}</h4>
              <span class="badge ${overallBadgeClass}" style="font-size:.82rem;white-space:nowrap">${esc(rev.overall_review)}</span>
            </div>
            <div style="font-size:.84rem;color:var(--text-dark)">
              <strong>Faculty Recommendation:</strong> <span>${esc(rev.final_recommendation)}</span>
            </div>
          </div>

          <!-- 2-Column Grid: Similarity & Domain -->
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
            <!-- Left: Similarity Signal -->
            <div style="border:1px solid #e2e8f0;border-radius:6px;padding:10px;background:#fff">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
                <span style="font-size:.78rem;font-weight:700;color:var(--text-light);text-transform:uppercase">Similarity Risk</span>
                <span class="badge ${rev.similarity_risk==='High Risk'?'badge-similarity':rev.similarity_risk==='Needs Review'?'badge-warned':'badge-submitted'}" style="font-size:.78rem">
                  ${rev.similarity_score}% (${esc(rev.similarity_risk)})
                </span>
              </div>
              <div style="font-size:.8rem;color:var(--text-dark)">
                ${rev.closest_matches && rev.closest_matches.length ? `
                  <div style="font-weight:600;margin-bottom:4px">Top Match:</div>
                  <div style="line-height:1.25">
                    <strong>${esc(rev.closest_matches[0].title)}</strong>
                    <span class="badge ${rev.closest_matches[0].similarity>=55?'badge-similarity':rev.closest_matches[0].similarity>=40?'badge-warned':'badge-submitted'}" style="font-size:.72rem;margin-left:4px">${rev.closest_matches[0].similarity}%</span>
                  </div>
                  ${rev.closest_matches.length > 1 ? `
                    <div style="margin-top:5px;font-size:.75rem;color:var(--text-light)">
                      +${rev.closest_matches.length - 1} other close match(es)
                    </div>
                  ` : ''}
                ` : `<span style="color:var(--text-light)">No similar existing proposal found.</span>`}
              </div>
            </div>

            <!-- Right: Domain Classification & Novelty -->
            <div style="border:1px solid #e2e8f0;border-radius:6px;padding:10px;background:#fff">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
                <span style="font-size:.78rem;font-weight:700;color:var(--text-light);text-transform:uppercase">Domain Classification</span>
                <span class="badge" style="background:#e0e7ff;color:#3730a3;font-size:.78rem">${esc(rev.predicted_domain)}</span>
              </div>
              <div style="font-size:.8rem;line-height:1.3">
                <div style="display:flex;justify-content:space-between;margin-bottom:4px">
                  <span style="color:var(--text-light)">Primary Model:</span>
                  <span style="font-size:.76rem;font-weight:600;color:var(--text-dark)">${rev.domain_model_type.includes('TF-IDF') ? 'Logistic Regression (74.3% Acc)' : 'BiLSTM'}</span>
                </div>
                ${rev.is_domain_uncertain ? `
                  <div style="margin-top:4px">
                    <span class="badge badge-warned" style="font-size:.72rem;display:inline-block;white-space:normal;line-height:1.2;padding:3px 6px">⚠️ ${esc(rev.domain_decision_status)}</span>
                  </div>
                ` : `
                  <div style="margin-top:3px;font-size:.74rem;color:#059669;font-weight:600">
                    ✓ High-Confidence Match (${rev.domain_confidence ? rev.domain_confidence + '%' : ''})
                  </div>
                `}
                <div style="margin-top:6px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #f1f5f9;padding-top:4px">
                  <span style="color:var(--text-light);font-size:.76rem">Novelty Signal:</span>
                  <span class="badge ${noveltyBadgeClass}" style="font-size:.72rem">${esc(rev.novelty_signal)}</span>
                </div>
              </div>
            </div>
          </div>

          <!-- Structured Technical Entities -->
          <div style="border:1px solid #e2e8f0;border-radius:6px;padding:10px 12px;background:#fff;margin-bottom:12px">
            <span style="font-size:.78rem;font-weight:700;color:var(--text-light);text-transform:uppercase;display:block;margin-bottom:6px">
              Technical Concepts Extracted
            </span>
            <div style="font-size:.8rem;display:flex;flex-direction:column;gap:5px">
              ${(grp.languages && grp.languages.length) ? `
                <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
                  <span style="font-size:.75rem;color:var(--text-light);min-width:72px">Languages:</span>
                  ${grp.languages.map(t=>`<span class="badge" style="background:#fef3c7;color:#92400e;font-size:.73rem">${esc(t)}</span>`).join('')}
                </div>
              ` : ''}
              ${(grp.frameworks && grp.frameworks.length) ? `
                <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
                  <span style="font-size:.75rem;color:var(--text-light);min-width:72px">Frameworks:</span>
                  ${grp.frameworks.map(t=>`<span class="badge" style="background:#e0f2fe;color:#0369a1;font-size:.73rem">${esc(t)}</span>`).join('')}
                </div>
              ` : ''}
              ${(grp.methods && grp.methods.length) ? `
                <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
                  <span style="font-size:.75rem;color:var(--text-light);min-width:72px">Methods:</span>
                  ${grp.methods.map(t=>`<span class="badge" style="background:#ede9fe;color:#5b21b6;font-size:.73rem">${esc(t)}</span>`).join('')}
                </div>
              ` : ''}
              ${(grp.domain_concepts && grp.domain_concepts.length) ? `
                <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
                  <span style="font-size:.75rem;color:var(--text-light);min-width:72px">Concepts:</span>
                  ${grp.domain_concepts.map(t=>`<span class="badge" style="background:#f1f5f9;color:#334155;font-size:.73rem">${esc(t)}</span>`).join('')}
                </div>
              ` : ''}
              ${(!rev.key_technologies || !rev.key_technologies.length) ? `
                <span style="color:var(--text-light);font-size:.78rem">No recognized technical entities found in proposal.</span>
              ` : ''}
            </div>
          </div>

          <!-- Collapsible Inspection Drawer -->
          <details style="border:1px solid #e2e8f0;border-radius:6px;padding:8px 10px;background:#f8fafc;font-size:.8rem;margin-bottom:10px">
            <summary style="font-weight:600;cursor:pointer;color:var(--primary);outline:none">
              🔍 Inspect Full Abstract & Model Verification
            </summary>
            <div style="margin-top:8px;padding-top:8px;border-top:1px solid #e2e8f0">
              <div style="margin-bottom:8px">
                <strong style="font-size:.78rem;color:var(--text-light);display:block;margin-bottom:2px">PROPOSAL ABSTRACT:</strong>
                <p style="margin:0;font-size:.82rem;line-height:1.4;color:var(--text-dark)">${p.description ? esc(p.description) : '<em>No abstract submitted.</em>'}</p>
              </div>

              ${rev.closest_matches && rev.closest_matches.length > 1 ? `
                <div style="margin-bottom:8px">
                  <strong style="font-size:.78rem;color:var(--text-light);display:block;margin-bottom:4px">ADDITIONAL SIMILAR PROJECTS:</strong>
                  <ul style="margin:0 0 0 16px;padding:0;font-size:.78rem">
                    ${rev.closest_matches.slice(1).map(m=>`
                      <li style="margin-bottom:3px">
                        <strong>${esc(m.title)}</strong> — <span class="badge ${m.similarity>=55?'badge-similarity':m.similarity>=40?'badge-warned':'badge-submitted'}" style="font-size:.7rem">${m.similarity}%</span>
                        ${m.match_reason ? `<span style="color:var(--text-light);font-size:.72rem"> (${esc(m.match_reason)})</span>` : ''}
                      </li>
                    `).join('')}
                  </ul>
                </div>
              ` : ''}

              <div style="font-size:.74rem;color:var(--text-light);line-height:1.35;border-top:1px solid #e2e8f0;padding-top:6px;margin-top:6px">
                ℹ️ <strong>Model Comparison:</strong> Primary domain predicted by Logistic Regression (74.3% benchmark accuracy). ${rev.lstm_domain ? `Unit IV BiLSTM predicted <em>${esc(rev.lstm_domain)}</em> (${rev.lstm_confidence || 0}% softmax).` : ''}
                <div style="margin-top:3px">Novelty signal: ${esc(rev.model_reliability.novelty_note)}. AI suggestions are advisory to assist faculty review; final approval authority remains with the faculty.</div>
              </div>
            </div>
          </details>
        `;
      }catch(err){
        console.error(err);
        b.innerHTML='<p style="color:var(--danger)">Connection error running Deep Learning analysis.</p>';
      }
    }
    function closeDLModal(){document.getElementById('dl-modal').classList.remove('active');}

    async function logout(){await fetch('/api/auth/logout',{method:'POST'});window.location.href='/';}

    function esc(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML;}
    function escA(t){return t.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');}

    function showToast(msg,type='info'){
      const c=document.getElementById('toast-container'),t=document.createElement('div');
      t.className=`toast toast-${type}`;t.textContent=msg;c.appendChild(t);
      setTimeout(()=>{t.style.animation='slideOut .3s ease forwards';setTimeout(()=>t.remove(),300);},4000);
    }

    init();
  </script>
</body>
</html>
