name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ============================================================
  # 1. Code Quality
  # ============================================================
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run black (format check)
        run: black --check --diff .

      - name: Run flake8 (lint)
        run: flake8 . --max-line-length=100 --exclude=__pycache__,.venv,venv

      - name: Run isort (import order check)
        run: isort --check-only .

  # ============================================================
  # 2. Unit Tests
  # ============================================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest with coverage
        run: |
          pytest tests/ -v \
            --cov=. \
            --cov-omit="tests/*,venv/*,.venv/*" \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  # ============================================================
  # 3. Docker Build (verify image builds cleanly)
  # ============================================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --tag hr-attrition-ai:ci \
            --label "git-commit=${{ github.sha }}" \
            .

      - name: Test Docker health check
        run: |
          docker run -d \
            --name hr-test \
            -p 5000:5000 \
            hr-attrition-ai:ci
          sleep 15
          docker exec hr-test \
            python -c "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')" \
            || (docker logs hr-test && exit 1)
          docker stop hr-test
