<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Information Retrieval Dashboard — Project Title Checker</title>
<link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/ir.css">
</head>
<body class="ir">
<nav class="navbar"><h1>Information Retrieval Dashboard</h1>
  <div class="navbar-right"><span class="user-info" id="who"></span><a class="btn" id="back" href="/">Back to Dashboard</a><button class="btn" onclick="logout()">Logout</button></div></nav>
<div class="ir-layout">
<aside class="ir-side" id="side"></aside>
<main class="ir-main">

<section class="panel" id="p-search">
 <div class="card"><h2>Ranked Search</h2>
  <div class="row"><div class="grow"><label for="s-q">Query</label><input id="s-q" placeholder="e.g. face recognition attendance" maxlength="500"></div>
   <input type="hidden" id="s-m" value="tfidf">
   <button class="btn btn-primary" id="s-go">Search</button></div><div class="out" id="s-out"></div></div>
</section>

<section class="panel" id="p-passage">
 <div class="card"><h2>Passage Retrieval</h2>
  <div class="row"><div class="grow"><label for="ps-q">Query</label><input id="ps-q" maxlength="500"></div><input type="hidden" id="ps-m" value="tfidf"></div>
  <div class="row"><div class="grow"><label for="ps-t">Text</label><textarea id="ps-t" rows="7"></textarea></div></div>
  <button class="btn btn-primary" id="ps-go">Rank passages</button><div class="out" id="ps-out"></div></div>
</section>

<section class="panel" id="p-rec">
 <div class="card"><h2>Content-Based Recommendation</h2>
  <div class="row"><div class="grow"><label for="r-q">Project idea or title</label><input id="r-q" maxlength="500"></div><button class="btn btn-primary" id="r-go">Recommend</button></div><div class="out" id="r-out"></div></div><div class="out" id="cf-out"></div>
</section>

<section class="panel" id="p-pr">
 <div class="card"><h2>PageRank</h2>
  <div class="row"><div><label for="pr-t">Similarity threshold (0–1)</label><input id="pr-t" type="number" step="0.05" min="0" max="1" value="0.15"></div><button class="btn btn-primary" id="pr-go">Compute</button></div><div class="out" id="pr-out"></div></div>
</section>

</main></div>
<script src="/js/ir.js"></script>
</body></html>
